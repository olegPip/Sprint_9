services:
  selenoid:
    image: aerokube/selenoid:1.11.3
    ports:
      - "4444:4444"
    volumes:
      - ./config/browsers.json:/etc/selenoid/browsers.json:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - OVERRIDE_VIDEO_OUTPUT_DIR=/tmp/video
      - LIMIT=3
    command: [
      "-conf", "/etc/selenoid/browsers.json",
      "-video-output-dir", "/opt/selenoid/video",
      "-log-output-dir", "/opt/selenoid/logs",
      "-container-network", "shared_test_net",
      "-limit", "3"
    ]
    networks:
      - custom_net

  tests:
    build: .
    depends_on:
      - selenoid
    environment:
      - SELENOID_URL=http://selenoid:4444/wd/hub
      - USE_SELENOID=true
    volumes:
      - .:/app
      - ./reports:/app/reports
    command: pytest test/
    networks:
      - custom_net

networks:
  custom_net:
    name: shared_test_net
    driver: bridge
